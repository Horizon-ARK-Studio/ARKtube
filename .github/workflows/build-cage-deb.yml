name: Build ARKtube Cage .deb

# Builds this branch's layer-shell-enabled Cage fork on a clean
# ubuntu-24.04 runner (matching the Noble target this is meant to run
# on) and packages the result as a .deb, so building it no longer
# depends on the exact package versions/toolchain quirks of any one
# machine.
#
# Several of cage's dependencies (wayland, libdrm, libxkbcommon,
# pixman, libdisplay-info, and wlroots itself) are too new for
# Noble's apt packages and get built from source as meson fallback
# subprojects -- see meson.build and subprojects/*.wrap. Those are
# forced to build *statically* here (default_library=static) so the
# final `cage` binary doesn't depend on private, unversioned .so files
# that would otherwise need to be packaged and kept in lockstep
# alongside it. Only genuine system libraries (EGL, GLESv2, gbm,
# Vulkan, libinput, libseat, udev, lcms2, cairo, X11/xcb, ...) remain
# as real shared-library runtime dependencies, and dpkg-shlibdeps
# below detects exactly those from the built binary itself rather than
# anyone hand-maintaining that list.
#
# libdrm's vendored kernel header (include/drm/i915_drm.h) trips a
# GCC 13 -Wpacked false positive ("packed attribute is unnecessary")
# on structs that are already naturally packed; libdrm's own
# meson.build builds with -Werror, turning that warning fatal. This
# is a known, harmless libdrm/GCC13 interaction (still present as of
# libdrm 2.4.134), so it's silenced with -Wno-error=packed rather than
# patching libdrm's vendored header.
#
# libdrm's nouveau/nouveau.c trips a second, unrelated GCC13
# false positive: a memcpy() inside nouveau_object_init() has a
# length GCC's range analysis can (incorrectly) widen to
# UINT32_MAX, firing -Werror=array-bounds even though the actual
# copy is always in-bounds. Same story as the -Wpacked case above
# (harmless upstream libdrm/GCC13 interaction, still present as of
# libdrm 2.4.134, fatal only because libdrm builds with -Werror) --
# silenced the same way, via -Wno-error=array-bounds, rather than
# patching libdrm's vendored nouveau.c.

on:
  push:
    branches: [arktube-layer-shell]
    paths:
      - 'meson.build'
      - 'src/**'
      - 'protocol/**'
      - 'subprojects/*.wrap'
      - '.github/workflows/build-cage-deb.yml'
  workflow_dispatch: {}

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config git scdoc bison \
            libwayland-dev libxkbcommon-dev libdrm-dev \
            libwlroots-dev libpixman-1-dev wayland-protocols \
            libegl1-mesa-dev liblcms2-dev hwdata glslang-tools \
            python3-pip dpkg-dev

      - name: Install a meson new enough for the bundled subprojects
        # Noble's apt meson (1.3.2) is below the >=1.4.0 the
        # libxkbcommon fallback subproject requires -- same reasoning
        # as session/lib-arktube-cage-deps.sh's ARKTUBE_CAGE_MIN_MESON_VERSION
        # on the install-script side of this branch.
        run: |
          pip install --user --break-system-packages "meson>=1.4.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          meson setup build --buildtype=release \
            -Ddefault_library=static \
            -Dwlroots:default_library=static \
            -Dwayland:default_library=static \
            -Dlibdrm:default_library=static \
            -Dlibxkbcommon:default_library=static \
            -Dpixman:default_library=static \
            -Dlibdisplay-info:default_library=static \
            -Dv4l-utils:default_library=static \
            -Dc_args="-Wno-error=packed -Wno-error=array-bounds"

      - name: Build
        run: meson compile -C build

      - name: Stage install tree and build .deb
        run: |
          set -euo pipefail
          VERSION="$(meson introspect build --projectinfo \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          PKGROOT="$PWD/pkgroot"
          DESTDIR="$PKGROOT" meson install -C build
          mkdir -p "$PKGROOT/DEBIAN"

          # Auto-detect the real remaining shared-library dependencies
          # from the built binary itself (dpkg-shlibdeps -O prints to
          # stdout instead of writing debian/substvars, which is the
          # documented way to use it outside a full debian/ source tree).
          DEPENDS="$(dpkg-shlibdeps -O "$PKGROOT/usr/local/bin/cage" 2>/dev/null \
            | sed -n 's/^shlibs:Depends=//p')"

          {
          echo "Package: arktube-cage"
          echo "Version: ${VERSION}"
          echo "Section: x11"
          echo "Priority: optional"
          echo "Architecture: amd64"
          echo "Depends: ${DEPENDS}"
          echo "Maintainer: Horizon ARK Studio"
          echo "Description: ARKtube's layer-shell-enabled Cage fork"
          echo " Wraps ARKtube in Cage with wlr-layer-shell-v1 support, built"
          echo " statically against the bundled wlroots/wayland/xkbcommon"
          echo " fallback subprojects this branch requires."
          } > "$PKGROOT/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$PKGROOT" "arktube-cage_${VERSION}_amd64.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: arktube-cage-deb
          path: '*.deb'
