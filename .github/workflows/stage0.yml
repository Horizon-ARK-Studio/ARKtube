name: Build AppImage

# Packages the ARKtube Neutralino shell into a Linux AppImage using the
# prebuilt neutralino-linux_x64 binary and resources checked into the repo.

on:
  push:
    branches: [main]
    paths:
      - "ARKtube/**"
      - ".github/workflows/stage0.yml"
  pull_request:
    paths:
      - "ARKtube/**"
      - ".github/workflows/stage0.yml"
  workflow_dispatch: {}

jobs:
  build-appimage:
    name: Build ARKtube AppImage (Linux x64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ARKtube

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (WebKitGTK, FUSE)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 \
            libfuse2

      - name: Make prebuilt binary executable
        run: chmod +x bin/neutralino-linux_x64

      - name: Assemble AppDir
        run: |
          set -e
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"

          cp bin/neutralino-linux_x64 "$APPDIR/usr/bin/ARKtube"
          chmod +x "$APPDIR/usr/bin/ARKtube"
          cp -r resources "$APPDIR/usr/bin/resources"
          cp neutralino.config.json "$APPDIR/usr/bin/neutralino.config.json"

          cp resources/icons/appIcon.png "$APPDIR/ARKtube.png"

          {
            echo "[Desktop Entry]"
            echo "Type=Application"
            echo "Name=ARKtube"
            echo "Exec=ARKtube"
            echo "Icon=ARKtube"
            echo "Categories=Network;AudioVideo;"
            echo "Terminal=false"
          } > "$APPDIR/ARKtube.desktop"

          {
            echo '#!/bin/sh'
            echo 'HERE="$(dirname "$(readlink -f "$0")")"'
            echo 'cd "$HERE/usr/bin"'
            echo 'exec ./ARKtube "$@"'
          } > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

      - name: Download appimagetool
        run: |
          curl -L -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        run: ./appimagetool --appimage-extract-and-run AppDir ARKtube-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARKtube-x86_64-AppImage
          path: ARKtube/ARKtube-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
