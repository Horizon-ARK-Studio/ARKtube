name: Build AppImage

# Packages the ARKtube Neutralino shell into a Linux AppImage.
#
# This delegates to `neu build --embed-resources` and the
# packaging/linux/ scripts (AppRun, build-appimage.sh) instead of hand
# -assembling the AppDir here, so CI and a local build can never drift
# apart again. See docs/BUGS-CAUGHT.md for why both of those matter:
#   - `neu build --embed-resources` bakes resources.neu into the binary,
#     so there's no separate resources file to lose track of.
#   - packaging/linux/AppRun launches with a writable --path, so
#     Neutralino's ./.tmp directory isn't created inside the read-only
#     AppImage mount.

on:
  push:
    branches: [main]
    paths:
      - "ARKtube/**"
      - ".github/workflows/stage0.yml"
  pull_request:
    paths:
      - "ARKtube/**"
      - ".github/workflows/stage0.yml"
  workflow_dispatch: {}

jobs:
  build-appimage:
    name: Build ARKtube AppImage (Linux x64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ARKtube

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (WebKitGTK, FUSE)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 \
            libfuse2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Neutralino CLI
        run: npm install -g @neutralinojs/neu

      - name: Make prebuilt binaries executable
        run: chmod +x bin/neutralino-linux_x64 bin/neutralino-linux_arm64 bin/neutralino-linux_armhf

      - name: Build AppImage
        run: ./packaging/linux/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARKtube-x86_64-AppImage
          path: ARKtube/ARKtube-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
