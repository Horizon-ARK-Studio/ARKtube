name: Android build (ARKtube)

# Builds a debug APK on GitHub-hosted runners on every push/PR that
# touches android-project/, installs and launches it on a throwaway
# emulator on the same runner to confirm it doesn't crash immediately,
# and separately builds a release APK (signed if RELEASE_KEYSTORE_BASE64
# and friends are configured as repo secrets, unsigned otherwise).
# Requires no JDK, Android SDK, or emulator/device on your own machine
# for any of the three jobs; all of it lives on the runner.
#
# Kept as a separate file from .github/workflows/stage0.yml (the
# desktop Neutralino AppImage build) since they build unrelated
# artifacts from unrelated parts of this repo -- path filters below
# keep each workflow from running on the other's changes.
on:
  push:
    branches: [main, Android]
    paths:
      - "android-project/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-project/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    # Same reasoning as HAS_RELEASE_KEYSTORE below: `secrets` isn't
    # allowed in a step's `if:`, only in `env:`, so this becomes a
    # job-level env var the steps can branch on.
    env:
      HAS_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_B64 != '' }}
    defaults:
      run:
        working-directory: android-project
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional -- only runs if DEBUG_KEYSTORE_B64 resolves, whether
      # that's an org-level secret shared with this repo or a
      # repo-level one (GitHub merges both into the same `secrets`
      # context by name, repo-level winning on a name collision --
      # there's no separate workflow syntax for "org" vs "repo", so
      # using the org-shared one is just a matter of the org secret
      # existing and this repo being in its visibility list).
      #
      # Written to app/debug.keystore, not android-project/debug.keystore
      # (this step's own working directory) -- app/build.gradle.kts
      # resolves DEBUG_KEYSTORE_PATH with Gradle's file(), which is
      # relative to *that build script's own module directory*
      # (android-project/app/), not this step's shell cwd. Writing one
      # level too high here is what made validateSigningDebug fail
      # with "Keystore file ... not found" even though this step
      # itself succeeded and HAS_DEBUG_KEYSTORE was true.
      - name: Decode debug keystore (optional)
        if: ${{ env.HAS_DEBUG_KEYSTORE == 'true' }}
        run: echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > app/debug.keystore

      - name: Assemble debug APK
        env:
          DEBUG_KEYSTORE_PATH: ${{ env.HAS_DEBUG_KEYSTORE == 'true' && 'debug.keystore' || '' }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEYSTORE_ALIAS: ${{ secrets.DEBUG_KEYSTORE_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARKtube-App-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  install-launch-smoke-test:
    name: Install + launch on an emulator
    needs: assemble-debug
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the project
        # This job only downloaded the APK artifact before, with no
        # checkout -- fine when everything was inline in the
        # workflow's `script:` block, but now that the smoke-test
        # logic lives in .github/scripts/android-smoke-test.sh (see
        # the "Install and launch on an emulator" step below), that
        # file needs to actually exist on the runner.
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ARKtube-App-debug-apk
          path: apk

      - name: Show downloaded artifact contents
        # Diagnostic: makes it obvious in the log exactly what
        # actions/download-artifact placed under apk/ (flat file,
        # nested dirs, or nothing) instead of failing opaquely later
        # inside the emulator-runner's adb install step.
        run: |
          echo "Contents of ./apk:"
          find apk -type f -exec ls -la {} \;

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # A single line, not a multi-line block: this action runs
          # each line of a multi-line `script:` input as its own
          # separate `sh -c` invocation rather than as one combined
          # script, which breaks any multi-line construct (variables
          # set on one line are gone by the next; an `if`/`fi` split
          # across lines becomes a bare, unterminated `if` on its
          # own). See .github/scripts/android-smoke-test.sh for the
          # actual logic and a fuller explanation.
          script: bash .github/scripts/android-smoke-test.sh

  assemble-release:
    name: Assemble release APK
    runs-on: ubuntu-latest
    # `secrets` isn't a permitted context inside a step's `if:` (only
    # inside `env:`) -- see the "Decode release keystore" step below,
    # which needed this rewritten from a direct `secrets.*` check to a
    # job-level env var it can read instead.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android-project
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional -- only runs if RELEASE_KEYSTORE_BASE64 resolves
      # (org-level or repo-level secret, same note as the debug job's
      # decode step above). Written to app/release.keystore for the
      # same reason as app/debug.keystore there: file() in
      # app/build.gradle.kts resolves relative to android-project/app/,
      # not this step's own working directory.
      - name: Decode release keystore (optional)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.HAS_RELEASE_KEYSTORE == 'true' && 'release.keystore' || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARKtube-App-release-apk
          path: android-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
