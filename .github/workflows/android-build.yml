name: Android build (ARKtube)

# Builds a debug APK on GitHub-hosted runners on every push/PR that
# touches android-project/, installs and launches it on a throwaway
# emulator on the same runner to confirm it doesn't crash immediately,
# and separately builds a release APK (signed if RELEASE_KEYSTORE_BASE64
# and friends are configured as repo secrets, unsigned otherwise).
# Requires no JDK, Android SDK, or emulator/device on your own machine
# for any of the three jobs; all of it lives on the runner.
#
# Kept as a separate file from .github/workflows/stage0.yml (the
# desktop Neutralino AppImage build) since they build unrelated
# artifacts from unrelated parts of this repo -- path filters below
# keep each workflow from running on the other's changes.
on:
  push:
    branches: [main]
    paths:
      - "android-project/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-project/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-project
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARKtube-App-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  install-launch-smoke-test:
    name: Install + launch on an emulator
    needs: assemble-debug
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ARKtube-App-debug-apk
          path: apk

      - name: Show downloaded artifact contents
        # Diagnostic: makes it obvious in the log exactly what
        # actions/download-artifact placed under apk/ (flat file,
        # nested dirs, or nothing) instead of failing opaquely later
        # inside the emulator-runner's adb install step.
        run: |
          echo "Contents of ./apk:"
          find apk -type f -exec ls -la {} \;

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            APK="$(find apk -name '*.apk' | head -n 1)"
            if [ -z "$APK" ]; then
              echo "::error::No .apk file found under apk/ -- listing what's actually there:"
              find apk -type f
              exit 1
            fi
            echo "Installing $APK"
            adb install -r "$APK"
            adb shell am start -n com.arktube.app/com.arktube.app.MainActivity
            sleep 5
            if ! adb shell pidof com.arktube.app; then
              echo "::error::App process not found a few seconds after launch -- it likely crashed on startup. See logcat below."
              adb logcat -d "*:E"
              exit 1
            fi
            echo "App launched and is still running -- smoke test passed."

  assemble-release:
    name: Assemble release APK
    runs-on: ubuntu-latest
    # `secrets` isn't a permitted context inside a step's `if:` (only
    # inside `env:`) -- see the "Decode release keystore" step below,
    # which needed this rewritten from a direct `secrets.*` check to a
    # job-level env var it can read instead.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android-project
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional -- only runs if the repo has a RELEASE_KEYSTORE_BASE64
      # secret configured. Writes the decoded keystore to a
      # workspace-local file that never leaves this job's runner.
      - name: Decode release keystore (optional)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.HAS_RELEASE_KEYSTORE == 'true' && 'release.keystore' || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARKtube-App-release-apk
          path: android-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
