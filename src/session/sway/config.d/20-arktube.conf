# 20-arktube.conf — ARKtube's own kiosk policy on top of Sway.
#
# Everything here is additive to Ubuntu's stock /etc/sway/config, which
# already `include`s /etc/sway/config.d/* — see docs/foundational/
# SYSTEM_DESIGN.md for why layer-shell + idle-inhibit make Sway the
# right compositor for this, and PROBLEM_STATEMENT.md for why this
# replaced the hand-patched Cage fork this branch started with.
#
# app_id below is NOT the illustrative "arktube" shown in the root
# README's sample config — that was documentation prose, not a value
# read from anywhere. The real value, confirmed directly against
# `main`'s arktube_linux/src/main.c, is set via
# g_set_prgname(ARKTUBE_WM_CLASS) with
# #define ARKTUBE_WM_CLASS "arktube-linux" — that's what GTK reports as
# the Wayland xdg_toplevel app_id, and packaging/arktube-linux.desktop's
# own StartupWMClass=arktube-linux agrees. A rule matching "arktube"
# instead would silently never fire.
for_window [app_id="arktube-linux"] fullscreen global
default_border none
gaps inner 0
gaps outer 0

# The installed binary is `arktube_linux` (see arktube_linux/CMakeLists.txt
# — `install(TARGETS arktube_linux RUNTIME DESTINATION bin)`), not
# `arktube`; that name belonged to the removed Neutralino wrapper script
# and no longer exists on PATH. `exec`, not `exec_always`, so a config
# reload doesn't relaunch ARKtube alongside itself.
exec arktube_linux

# TV-style system overlay (network/volume/brightness/lock/power) — same
# overlay.py this branch salvaged byte-for-byte from `webtop`'s
# session/overlay/ (now src/overlay/ after the folder rearrange). It
# targets wlr-layer-shell-v1 directly via gtk-layer-shell and required
# no changes to run under Sway; see docs/foundational/SYSTEM_DESIGN.md's
# "The overlay: why layer-shell, not a window" section. Deployed to
# ~/.local/share/arktube-overlay/ by install.sh, same destination the
# webtop edition already uses, so the two editions stay symmetric.
#
# `exec`, not `exec_always`, for the same reload-safety reason as
# arktube_linux above — a second overlay.py on reload would mean two
# gtk-layer-shell surfaces fighting over the same anchored corner.
exec python3 "$HOME/.local/share/arktube-overlay/overlay.py"

# --- Remote input mapping (docs/planning/REMOTE-INPUT-MAPPING.md) ---
#
# D-Pad, Home, Search, and Play/Pause/Next/Prev need no bindsym at
# all — see that doc's "Where each button's logic actually lives"
# table. Everything below is what genuinely needs a line here.

# Cursor auto-hide. Sway has this natively — no unclutter, no X11-only
# caveat like `webtop` needed for GNOME Kiosk.
seat seat0 hide_cursor 3000
seat seat0 hide_cursor when-typing enable

# Volume — bypasses overlay.py for the actual change; it already polls
# wpctl on every status refresh (and, since the OSD toast work, reacts
# to that poll directly — see static/app.js's applyVolume()), so the
# on-screen indicator just reflects whatever Sway set here.
#
# --locked so these still fire while overlay.py's own lock-state
# keyboard_mode=EXCLUSIVE is active (see overlay.py's lock()) — volume
# arguably should work even when locked, the same way it does on a
# real TV.
#
# Researched, not just assumed: KEY_VOLUMEUP/DOWN/MUTE are Linux's
# own standard input-event-codes, and every general-purpose consumer
# remote/keyboard that reports them at all reports them as these
# exact evdev codes, which XKB's stock "evdev" keycodes file maps
# straight through to XF86AudioRaiseVolume/LowerVolume/Mute — unlike
# Menu/Power below, this part isn't remote-model-specific. What *is*
# remote-model-specific, and confirmed here rather than assumed: not
# every physical remote sends these to the paired host as Bluetooth
# HID events at all. A first-generation Amazon Fire TV Remote (bus
# 0x5, vendor 0x1949, product 0x404 — confirmed via public `evtest`
# dumps: forum.kodi.tv/showthread.php?pid=2378965,
# xdaforums.com/t/bluetooth-amazon-firetv-stick-remote.3032627) has no
# Volume/Mute buttons at all. Newer Alexa Voice Remotes that do have
# them commonly drive the *TV's* volume via IR or HDMI-CEC instead —
# Amazon's own documentation for third-party (non-Fire-TV) apps notes
# these "can't be mapped to events" the app receives at all. So these
# bindsyms are correct and sufficient for any remote/dongle that does
# emit KEY_VOLUMEUP/DOWN/MUTE as Bluetooth HID to this box directly
# (confirmed for at least the NVIDIA Shield remote, which does — see
# wiki.coreelec.org/remote:rr_bluetooth's own evtest dump), but will
# simply never fire for a remote whose volume buttons only talk
# IR/CEC to the physical TV. Confirm which case applies with `wev` or
# `evtest` against the specific remote/dongle actually being paired,
# same as this doc's own standard elsewhere.
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute        exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness — same bypass-overlay.py-for-the-actual-change pattern as
# Volume above, and for the same reason: overlay.py's _brightness()
# already polls `brightnessctl` on every status refresh and pops the
# OSD toast the moment it sees the level change (see static/app.js's
# applyBrightness()), so there's nothing for a bindsym to push into
# overlay.py directly — Sway calling brightnessctl is the whole fix.
# `brightnessctl` is already an install.sh dependency (installed
# alongside upower for the same overlay). --locked for the same
# "should work even while locked, like a real TV" reasoning as Volume.
bindsym --locked XF86MonBrightnessUp   exec brightnessctl set +5%
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-

# Menu (☰) — opens overlay.py's corner panel via a POSIX signal (see
# overlay.py's main() and its set_panel() docstring); overlay.py is a
# separate process from Sway so a bindsym can't call into it directly.
#
# Researched: three independent public `evtest` dumps of an actual
# "Amazon Fire TV Remote" over Bluetooth (Kodi forum, XDA forum, and
# the MMM-KeyBindings wiki setup guide — all three report the exact
# same device, bus 0x5/vendor 0x1949/product 0x404) agree the ☰
# button reports raw evdev KEY_MENU (code 139). XKB's stock "evdev"
# keycodes file offsets that by 8 for X11/Wayland (139+8=147) — a
# Raspberry Pi forum thread doing hands-on `xinput --test` against
# this same remote independently arrived at X11 keycode 147 for this
# button, which agrees. `Menu` (XKB keysym 0xff67) is what X11/Wayland's
# stock "evdev" keycodes+symbols pair actually binds at keycode 147, so
# it alone is both necessary and sufficient here.
#
# `XF86Menu` was bound alongside it as a second, defensive candidate in
# case `Menu` turned out not to be it. It wasn't a candidate at all:
# libxkbcommon's own keysymdef has no `XF86Menu` entry (checked against
# /usr/include/xkbcommon/xkbcommon-keysyms.h — the closest real
# entries are XF86MenuKB/XF86MenuPB, neither of which is this key), so
# Sway's parser rejected the whole line as "Unknown key or button" —
# not a defensive extra binding, a config file that fails to load at
# all, which is what actually put a swaynag "There is an error in your
# config file" bar across the top of the screen. Removed rather than
# corrected to a real XF86 name, since `Menu` was already confirmed
# correct and sufficient on its own.
#
# A second way in, not dependent on the physical remote's Menu button
# at all: $mod+s from any attached keyboard, for testing and as a
# permanent fallback. $mod is Ubuntu's stock Sway default ($mod Mod4,
# i.e. the Super/Windows key) — see /etc/sway/config.
bindsym --locked Menu    exec pkill -SIGUSR1 -f overlay.py
bindsym --locked $mod+s  exec pkill -SIGUSR1 -f overlay.py

# Power — opens overlay.py's new centered Shut Down/Restart/Log Out
# panel via SIGUSR2 (see overlay.py's main() and PANEL_GEOMETRY).
#
# Researched, and genuinely remote-model-dependent, unlike Menu above:
# the first-generation Fire TV Remote's own evtest dump (same sources
# cited under Volume) has no Power button at all. Where a Power button
# does exist, it isn't guaranteed to reach this box as a Bluetooth HID
# event either — same IR/HDMI-CEC caveat as Volume. Where it *is*
# delivered as HID, KEY_POWER (evdev code 116) is XKB's stock mapping
# to XF86PowerOff (confirmed for the NVIDIA Shield remote's own evtest
# dump, wiki.coreelec.org/remote:rr_bluetooth, and independently for a
# generic USB keyboard's own Power key by a Raspberry Pi forum thread
# doing the same `xmodmap -pk` check this project's methodology calls
# for). Bound here on that basis; confirm against the actual
# remote/dongle being paired before relying on it.
bindsym --locked XF86PowerOff exec pkill -SIGUSR2 -f overlay.py

# --- Fixed: the "There is an error in your config file" bar ---
#
# That message is swaynag, not swaybar — Sway's own reaction to a
# config file it couldn't fully parse, not a symptom of ARKtube or the
# overlay themselves. It was the removed `bindsym --locked XF86Menu
# ...` line above: `XF86Menu` isn't a real keysym name at all (checked
# against /usr/include/xkbcommon/xkbcommon-keysyms.h — no such symbol
# exists; the nearest real entries are XF86MenuKB/XF86MenuPB, neither
# of which is this key), so Sway's parser rejected that one line as
# "Unknown key or button" and refused to finish loading the file,
# which is what put swaynag up. Confirmed fixed with `sway -C -c
# <config>` after removing it, which now exits clean with no errors.
#
# Sway does still `exec` every line that parsed successfully even when
# a later line fails this way — arktube_linux, the overlay, and the
# Volume bindsyms above `XF86Menu`'s old line all started regardless —
# so this was never why the overlay's corner pill failed to open. That
# was purely the *lack* of a working way to trigger it without a
# mouse: `Menu` alone (a real, working binding, kept above) depends on
# a physical key most keyboards don't have, and nothing else called
# set_panel('overlay') at all. `$mod+s` above is the fix — a real,
# always-available keyboard path to the same signal.
#
# --- Open, not yet resolved here ---
#
# Ubuntu's stock /etc/sway/config ships its own `bar { swaybar_command
# ... }` block (i3status/swaybar), and swaybar's bar surface is drawn via
# layer-shell at the "top" layer with an exclusive zone — which is not
# automatically suppressed by `fullscreen global` the way a normal
# top-level window would be. Whether that default bar ends up visibly
# competing with ARKtube (and this overlay, itself anchored top-right at
# `layer: overlay`, one layer above swaybar's `top`) has not been
# confirmed against a real display — no display manager in this
# environment, same caveat every prior stage in this project carries.
# If it does show through, the fix is a `bar { mode invisible }` block
# here rather than editing the package-owned default config in place —
# consistent with how this project has always avoided touching
# package-owned conffiles (see webtop's own install script and its
# reasoning for adding sibling .desktop files instead of editing
# gnome-kiosk-script-session's).
#
# Whether the Fire TV remote's Play/Pause/Next/Prev keys actually
# arrive as the standard XF86Audio{Play,Pause,Next,Prev}/AudioPlay
# keysyms this project is relying on ARKtube's own Media Session API
# passthrough to handle (no bindsym needed either way, since these
# are meant to reach ARKtube, not Sway) has likewise not been
# re-confirmed against real hardware from here.
