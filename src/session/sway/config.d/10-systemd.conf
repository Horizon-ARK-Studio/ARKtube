# 10-systemd.conf — session-target wiring, straight from the sway wiki's
# own Systemd-integration page (https://github.com/swaywm/sway/wiki/Systemd-integration).
# Not ARKtube-specific: this is the same fragment any sway session would
# use to start/stop sway-session.target. Kept as its own file, separate
# from 20-arktube.conf, so it can be reused (or diffed against upstream)
# independently of ARKtube's own policy.
#
# Companion unit: src/session/systemd/user/sway-session.target, installed
# to ~/.config/systemd/user/sway-session.target by install.sh.

# Runs once, at startup only (`exec`, not `exec_always`): imports the
# variables systemd user services actually need to talk to this
# Wayland session (WAYLAND_DISPLAY, SWAYSOCK) into the systemd --user
# environment, then starts the target. Any `WantedBy=sway-session.target`
# user unit — arktube-overlay, if it's ever converted from the plain
# `exec` in 20-arktube.conf to a real unit — starts only after this
# line has run.
#
# Also imports XDG_CURRENT_DESKTOP, which this file previously did
# not — a drift from SYSTEM_DESIGN.md's own documented sample for
# this exact line, found by diffing the doc against the shipped
# config rather than assuming they'd stayed in sync. Without it,
# anything started under sway-session.target that branches on
# $XDG_CURRENT_DESKTOP (xdg-desktop-portal backend selection being
# the common case) sees an empty value instead of "sway" in the
# systemd --user environment, even though Sway's own process
# environment has it (set via DesktopNames=sway in arktube.desktop,
# which pam_systemd/GDM export into the session). See
# docs/bugs_caught/xdg-current-desktop-not-imported.md.
exec "systemctl --user import-environment {,WAYLAND_}DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP; systemctl --user start sway-session.target"

# Mirror image of the line above: blocks on sway's own IPC "shutdown"
# event, then stops the target the moment sway itself is going down —
# not after, and not relying on any Restart=/KillMode= unit behavior to
# notice sway is gone. This is what SYSTEM_DESIGN.md's own version of
# this fragment left out; add it back rather than leave the target
# dangling "started" after logout.
exec swaymsg -t subscribe '["shutdown"]' && systemctl --user stop sway-session.target
