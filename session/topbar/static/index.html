<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARKtube Topbar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Collapsed strip: always visible, always on top -->
  <div id="bar">
    <div id="bar-left"></div>

    <button id="clock-pill" class="pill" type="button">
      <span id="clock-time">--:--</span>
    </button>

    <div id="bar-right">
      <button id="wifi-btn" class="icon-btn" type="button" title="Wi-Fi">
        <svg viewBox="0 0 24 24"><path d="M12 20a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2Zm-5.4-5.4a7.6 7.6 0 0 1 10.8 0l-1.8 1.8a5.2 5.2 0 0 0-7.2 0Zm-3.6-3.6a12.4 12.4 0 0 1 18 0l-1.8 1.8a10 10 0 0 0-14.4 0Z"/></svg>
      </button>
      <button id="volume-btn" class="icon-btn" type="button" title="Volume">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4Zm11.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 15.5 12Z"/></svg>
      </button>
      <button id="battery-btn" class="icon-btn battery" type="button" title="Battery">
        <span id="battery-pct">--%</span>
      </button>
    </div>
  </div>

  <div id="backdrop"></div>

  <!-- Calendar + notifications panel (opens from the clock) -->
  <div id="calendar-panel" class="panel">
    <div class="panel-col notif-col">
      <div class="notif-empty">
        <svg viewBox="0 0 24 24" class="bell"><path d="M12 22a2.2 2.2 0 0 0 2.2-2.2H9.8A2.2 2.2 0 0 0 12 22Zm7-6.2V11a7 7 0 0 0-5.5-6.84V3a1.5 1.5 0 0 0-3 0v1.16A7 7 0 0 0 5 11v4.8L3 17.8V19h18v-1.2Z"/></svg>
        <div>No Notifications</div>
      </div>
      <div class="notif-footer">
        <label class="switch-row">
          <span>Do Not Disturb</span>
          <span class="switch"><input id="dnd-toggle" type="checkbox"><span class="slider"></span></span>
        </label>
        <button id="clear-notif" class="ghost-btn" type="button">Clear</button>
      </div>
    </div>

    <div class="panel-col cal-col">
      <div class="cal-header">
        <div id="cal-weekday" class="cal-weekday">—</div>
        <div id="cal-date" class="cal-date">—</div>
      </div>

      <div class="cal-nav">
        <button id="cal-prev" class="nav-btn" type="button">&#8249;</button>
        <div id="cal-month-label" class="cal-month-label">—</div>
        <button id="cal-next" class="nav-btn" type="button">&#8250;</button>
      </div>

      <div id="cal-grid" class="cal-grid"></div>

      <div class="mini-card">
        <div class="mini-card-title">Today</div>
        <div class="mini-card-body">No Events</div>
      </div>

      <div class="mini-card">
        <div class="mini-card-title">World Clocks</div>
        <div id="world-clocks" class="mini-card-body world-clocks"></div>
      </div>
    </div>
  </div>

  <!-- Quick-settings panel (opens from wifi/volume/battery) -->
  <div id="quicksettings-panel" class="panel">
    <div class="qs-row qs-top">
      <div class="qs-battery-pill">
        <svg viewBox="0 0 24 24"><path d="M16 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v1h-1v-1H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h9V6h1v1Zm2 3h1v2h-1v-2Z"/></svg>
        <span id="qs-battery-pct">--%</span>
      </div>
      <div class="qs-top-icons">
        <button id="qs-screenshot" class="mini-icon-btn" type="button" title="Screenshot">
          <svg viewBox="0 0 24 24"><path d="M9 4 7.5 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.5L15 4H9Zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
        </button>
        <button id="qs-lock" class="mini-icon-btn" type="button" title="Lock">
          <svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 0 0-4 4v3H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a4 4 0 0 0-4-4Zm-2 7V6a2 2 0 1 1 4 0v3h-4Z"/></svg>
        </button>
        <button id="qs-power" class="mini-icon-btn" type="button" title="Power">
          <svg viewBox="0 0 24 24"><path d="M12 2v9h1V2h-1ZM7.3 5.7A8 8 0 1 0 16.7 5.7l-.9.9a7 7 0 1 1-8.6 0l-.9-.9Z"/></svg>
        </button>
      </div>
    </div>

    <div id="power-menu" class="power-menu hidden">
      <button id="power-logout" class="ghost-btn" type="button">Log Out</button>
      <button id="power-reboot" class="ghost-btn" type="button">Restart</button>
      <button id="power-poweroff" class="ghost-btn danger" type="button">Power Off</button>
    </div>

    <div class="qs-slider-row">
      <svg viewBox="0 0 24 24" class="qs-slider-icon"><path d="M4 9v6h4l5 5V4L8 9H4Zm11.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 15.5 12Z"/></svg>
      <input id="volume-slider" type="range" min="0" max="100" value="0" class="slider-range">
    </div>

    <div class="qs-slider-row">
      <svg viewBox="0 0 24 24" class="qs-slider-icon"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5h0v2h0V2Zm0 18v2h0v-2h0Zm10-8h-2 0 2Zm-18 0H2h0 2Zm15.4-6.4-1.4 1.4 1.4-1.4Zm-12.8 12.8-1.4 1.4 1.4-1.4Zm12.8 1.4-1.4-1.4 1.4 1.4ZM6.4 6.4 5 5l1.4 1.4Z"/></svg>
      <input id="brightness-slider" type="range" min="1" max="100" value="50" class="slider-range">
    </div>

    <div class="qs-grid">
      <button id="qs-wifi" class="qs-tile active" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 20a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2Zm-5.4-5.4a7.6 7.6 0 0 1 10.8 0l-1.8 1.8a5.2 5.2 0 0 0-7.2 0Zm-3.6-3.6a12.4 12.4 0 0 1 18 0l-1.8 1.8a10 10 0 0 0-14.4 0Z"/></svg>
        <span class="qs-tile-text">
          <span class="qs-tile-title">Wi-Fi</span>
          <span id="qs-wifi-sub" class="qs-tile-sub">Off</span>
        </span>
        <span class="chev">&#8250;</span>
      </button>

      <button id="qs-bluetooth" class="qs-tile" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 2 8 6l3 3-3 3 4 4v4l4-4-3.5-3.5L16 9l-4-4V2Zm0 5 1.5 1.5L12 10V7Zm0 7 1.5 1.5L12 17v-3Z"/></svg>
        <span class="qs-tile-text">
          <span class="qs-tile-title">Bluetooth</span>
        </span>
        <span class="chev">&#8250;</span>
      </button>

      <button id="qs-nightlight" class="qs-tile" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 4a1 1 0 0 1 1 1v1.06A6 6 0 0 1 18 12h1a1 1 0 1 1 0 2h-1a6 6 0 0 1-5 5.92V21a1 1 0 1 1-2 0v-1.08A6 6 0 0 1 6 14H5a1 1 0 1 1 0-2h1a6 6 0 0 1 5-5.94V5a1 1 0 0 1 1-1Z"/></svg>
        <span class="qs-tile-text"><span class="qs-tile-title">Night Light</span></span>
      </button>

      <button id="qs-darkstyle" class="qs-tile" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
        <span class="qs-tile-text"><span class="qs-tile-title">Dark Style</span></span>
      </button>
    </div>

    <button id="qs-airplane" class="qs-tile qs-tile-wide" type="button">
      <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V4a1.5 1.5 0 0 0-3 0v5l-8 5v2l8-2.5V19l-2.5 2v1.5L12 21l4.5 1.5V19l-2.5-2v-4.5Z"/></svg>
      <span class="qs-tile-text"><span class="qs-tile-title">Airplane Mode</span></span>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
