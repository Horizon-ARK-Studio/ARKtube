# override.conf — deployed to
# ~/.config/systemd/user/org.gnome.Kiosk.Script.service.d/override.conf
#
# gnome-kiosk-script-session (46.0-1build2, the version Ubuntu 24.04 Noble
# ships) installs org.gnome.Kiosk.Script.service with Restart=always and no
# RestartSec override — confirmed by extracting that exact .deb and reading
# the unit file directly, not by inference from changelog text:
#
#   [Service]
#   ExecStart=/usr/bin/gnome-kiosk-script
#   Restart=always
#
# That file is owned by the package, so it isn't edited in place here (that
# would show up as a modified conffile on the package's next update). This
# drop-in overrides just the one directive.
#
# Why this matters: gnome-session-binary (run via gnome-session-manager@.service
# as --systemd-service) is what actually watches this session's required
# systemd units and decides when the session itself should end. Empirically,
# it does not treat "the required unit keeps getting auto-restarted" as "the
# required unit is gone" — it only ends the session once the unit reaches a
# terminal state with no further restart pending. Under Restart=always that
# terminal state never arrives: gnome-kiosk-script exiting (ARKtube crashing,
# or ARKtube being closed deliberately) just gets relaunched, over and over,
# with no way back to the GDM login screen short of killing the compositor.
#
# Removing the restart is also exactly the fix GNOME Kiosk 50 shipped
# upstream: its NEWS file states plainly, for the 50.rc cycle, "Do not
# restart the script session on exit (allows logout)". Noble ships 46, which
# predates that fix, so it's reproduced here as a drop-in rather than waited
# on.
#
# `Restart=` has no override syntax to unset a single key back to its
# compiled-in default from a drop-in, so it's set explicitly to `no`.
#
# KillMode=control-group is pinned explicitly (Stage 4 — see
# docs/STAGE-4-HARDENING.md) rather than left to systemd's own default,
# even though that default already happens to be control-group. `main`'s
# actual shipped config (checked directly, not assumed from its own docs
# — see the Stage 4 doc for why those are stale) runs ARKtube in
# Neutralino's chrome mode, which launches Chrome/Chromium as a
# separate, detached process (TinyProcessLib calls setpgid(0, 0) on
# Linux, so it's outside this service's process group). A detached
# process still inherits this service's cgroup on fork, which is what
# lets control-group kill it along with the main process on unit stop —
# but that's relying on an implicit default for something session
# hardening depends on, so it's pinned here rather than left silent.
[Service]
Restart=no
KillMode=control-group
